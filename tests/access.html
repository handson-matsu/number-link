<!doctype html><meta charset="utf-8"><title>Access logging tests</title><pre id="results">Running…</pre><iframe id="app" src="fixture.html" style="width:390px;height:600px"></iframe><script src="../config.js"></script><script type="module">
import {createAccessRecorder} from '../access-counter.js';
let checks=0;const assert=(v,label)=>{if(!v)throw Error(label);checks++};
const wait=async condition=>{const deadline=Date.now()+10000;while(!condition()){if(Date.now()>deadline)throw Error('Timed out');await new Promise(r=>setTimeout(r,30))}};
try{
 const endpoint=window.NUMBERLINK_CONFIG.gasUrl;
 for(const behavior of ['success','reject','throw']){
  const calls=[];const record=createAccessRecorder((url,options)=>{calls.push({url,options});if(behavior==='throw')throw Error('offline');return behavior==='reject'?Promise.reject(Error('offline')):Promise.resolve({type:'opaque'})},{gasUrl:endpoint});
  record();record();await new Promise(r=>setTimeout(r,0));record();
  assert(calls.length===1,behavior+' attempts once');assert(calls[0].url===endpoint+'?app=number-link','exact URL');
  assert(JSON.stringify(calls[0].options)===JSON.stringify({method:'GET',mode:'no-cors',cache:'no-store',credentials:'omit',keepalive:true}),'same GET options');
 }
 for(const gasUrl of ['', 'invalid URL']){let calls=0;const record=createAccessRecorder(()=>{calls++},{gasUrl});record();record();assert(calls===0,'unconfigured or invalid skips safely')}
 const missing=createAccessRecorder(undefined,{gasUrl:endpoint});missing();missing();assert(true,'missing fetch does not throw');
 const frame=document.querySelector('#app');await wait(()=>frame.contentDocument?.querySelector('.endpoint'));
 let w=frame.contentWindow,d=frame.contentDocument;
 assert(w.accessRequests.length===1,'first display once');
 assert(w.accessRequests[0].url===endpoint+'?app=number-link','configured URL on display');
 d.querySelectorAll('.puzzle-choice')[1].click();d.querySelector('#hint').click();d.querySelector('#reset').click();d.querySelector('#undo').click();
 await new Promise(r=>setTimeout(r,100));assert(w.accessRequests.length===1,'actions and rejection do not retry');
 const previous=d;w.location.reload();await wait(()=>frame.contentDocument!==previous&&frame.contentDocument?.querySelector('.endpoint'));
 w=frame.contentWindow;d=frame.contentDocument;
 assert(w.accessRequests.length===1,'reload exactly once in new document');
 assert(w.accessRequests[0].url===endpoint+'?app=number-link','same URL on reload');
 assert(d.querySelectorAll('.puzzle-choice').length===10,'game loads despite failure');
 document.querySelector('#results').textContent=`PASS — ${checks} access logging assertions; initial load, real reload, GET options, rejection/synchronous failure, no retries, gameplay verified without production requests.`;
}catch(e){document.querySelector('#results').textContent='FAIL '+e.stack;throw e}
</script>
